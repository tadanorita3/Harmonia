<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonia - みんなで共有する音楽の場所</title>
    
    <meta property="og:title" content="Harmonia - みんなで共有する音楽の場所">
    <meta property="og:description" content="統合失調症や心の辛さと闘う中で、私を支えてくれた音楽たち。Spotify, Apple Music, YouTube対応。">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Harmonia - 心に寄り添う音楽の共有場所">
    <meta name="twitter:description" content="辛いとき、私を支えてくれた音楽をまとめました。統合失調症や心の不調と闘う人のための、優しく温かい音楽共有サイトです。">
    <meta name="twitter:image" content="https://tadanorita3.github.io/Harmonia/assets/images/%E9%9F%B3%E6%A5%BD%E3%82%92%E8%81%B4%E3%81%8F%E5%A5%B3%E6%80%A7.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* --- CSS設定（以前と同じデザイン） --- */
        :root {
            --bg-color: #e8f5e9;
            --accent-color: #81c784;
            --text-color: #445544;
            --card-bg: #ffffff;
            --spotify-color: #1DB954;
            --apple-color: #fa243c;
            --youtube-color: #FF0000;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-image: 
                radial-gradient(#fff 10%, transparent 10%),
                radial-gradient(#fff 10%, transparent 10%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            background-attachment: fixed;
        }

        header { text-align: center; padding: 2rem 1rem; }
        .header-icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        h1 { font-size: 1.5rem; margin: 0; color: var(--text-color); }
        .subtitle { font-size: 0.9rem; opacity: 0.8; margin-top: 5px; }

        .hero {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            text-align: center;
            position: relative;
        }
        .hero img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            filter: brightness(0.95);
        }
        .hero-text { margin-top: 1rem; font-weight: bold; }

        .post-section {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 90%;
            box-sizing: border-box;
        }
        .post-section h3 { text-align: center; margin-top: 0; color: var(--accent-color); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-color); }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button.submit-btn:hover { background-color: #66bb6a; }
        button.submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .playlist-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .section-title {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .section-title::before, .section-title::after { content: "🕊️"; margin: 0 10px; font-size: 1.2rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card:hover { transform: translateY(-5px); }

        .service-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .service-spotify { color: var(--spotify-color); }
        .service-apple { color: var(--apple-color); }
        .service-youtube { color: var(--youtube-color); }

        .card-iframe-container {
            width: 100%;
            height: 180px;
            background: #eee;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }
        .card-iframe-container iframe { width: 100%; height: 100%; border: none; }
        .card-content { padding: 15px; flex-grow: 1; }
        .card-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .card-artist { font-size: 0.9rem; color: #777; margin-bottom: 10px; }
        .card-comment {
            font-size: 0.9rem;
            color: #555;
            background: #f9fbe7;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .card-date {
            font-size: 0.75rem;
            color: #aaa;
            text-align: right;
            margin-top: 5px;
        }

        /* ロード中の表示 */
        #loadingMsg { text-align: center; width: 100%; color: #888; display: none; }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #666;
            background: rgba(255,255,255,0.5);
            margin-top: 40px;
        }
        
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .hero img { height: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-icon">🎧</div>
        <h1>私の希望のプレイリスト</h1>
        <div class="subtitle">統合失調症との闘いを支えた音楽たち</div>
    </header>

    <div class="hero">
        <img src="./assets/images/音楽を聴く女性.jpg" alt="音楽を聴く女性">
        <div class="hero-text">
            あなたは一人じゃない。<br>
            これらの歌が私に勇気を与えてくれた。
        </div>
    </div>

    <div class="post-section">
        <h3>あなたの「支えになった曲」を教えてください</h3>
        <form id="songForm">
            <div class="form-group">
                <label>曲のタイトル</label>
                <input type="text" id="title" placeholder="例: Fight Song" required>
            </div>
            <div class="form-group">
                <label>アーティスト名</label>
                <input type="text" id="artist" placeholder="例: Rachel Platten" required>
            </div>
            <div class="form-group">
                <label>曲のURL (Spotify / Apple Music / YouTube)</label>
                <input type="url" id="url" placeholder="各アプリの「共有」リンクを貼り付け" required>
                <small style="color:#888; font-size:0.8em;">※3つのサービスに対応しています</small>
            </div>
            <div class="form-group">
                <label>ひとこと・思い出</label>
                <textarea id="comment" rows="3" placeholder="辛いときにこの歌詞に救われました...など" required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">投稿する</button>
        </form>
    </div>

    <div class="playlist-container">
        <h2 class="section-title">みんなの勇気の曲</h2>
        <div id="loadingMsg">読み込み中... 🕊️</div>
        <div id="grid" class="grid"></div>
    </div>

    <footer>
        同じ空の下で、応援しています。<br>
        © 2025 Harmonia. All rights reserved.
    </footer>

    <script type="module">
        // Firebaseの機能をインポート
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC78I9Hr100hVL-TiPwNkM-55dZ-1ZvFB0",
            authDomain: "harmonia-music-share.firebaseapp.com",
            projectId: "harmonia-music-share",
            storageBucket: "harmonia-music-share.firebasestorage.app",
            messagingSenderId: "144347642934",
            appId: "1:144347642934:web:57e2baa8cfc274c326ec97",
            measurementId: "G-22RDV9G01P"
        };
        // ------------------------------------------------------------------

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COLLECTION_NAME = "songs"; // データベース内の保存場所名

        // ------------------------------------------------------------------
        // URL判別ロジック
        // ------------------------------------------------------------------
        function detectService(url) {
            if (url.includes('spotify.com')) return 'spotify';
            if (url.includes('music.apple.com')) return 'apple';
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
            return null;
        }

        function getEmbedUrl(url) {
            const service = detectService(url);
            if (!service) return null;

            if (service === 'spotify') {
                const match = url.match(/track\/([a-zA-Z0-9]+)/);
                if (match) return `https://open.spotify.com/embed/track/${match[1]}?utm_source=generator`;
            } else if (service === 'apple') {
                return url.replace('music.apple.com', 'embed.music.apple.com');
            } else if (service === 'youtube') {
                const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
                if(match) return `https://www.youtube.com/embed/${match[1]}`;
            }
            return null;
        }

        // ------------------------------------------------------------------
        // 表示ロジック
        // ------------------------------------------------------------------
        function createCard(song) {
            const embedSrc = getEmbedUrl(song.url);
            const service = detectService(song.url);
            
            let iconHtml = '';
            if (service === 'spotify') iconHtml = '<div class="service-badge service-spotify"><i class="fab fa-spotify"></i></div>';
            else if (service === 'apple') iconHtml = '<div class="service-badge service-apple"><i class="fab fa-apple"></i></div>';
            else if (service === 'youtube') iconHtml = '<div class="service-badge service-youtube"><i class="fab fa-youtube"></i></div>';

            // HTMLのエスケープ処理（セキュリティ対策）
            const safeTitle = escapeHtml(song.title);
            const safeArtist = escapeHtml(song.artist);
            const safeComment = escapeHtml(song.comment);

            return `
                <div class="card">
                    ${iconHtml}
                    <div class="card-iframe-container">
                        ${embedSrc 
                            ? `<iframe src="${embedSrc}" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>` 
                            : '<div style="padding:40px; text-align:center; color:#888;">Preview Unavailable</div>'}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${safeTitle}</div>
                        <div class="card-artist">${safeArtist}</div>
                        <div class="card-comment">${safeComment}</div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            if(!str) return "";
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // ------------------------------------------------------------------
        // データ読み込み・書き込み
        // ------------------------------------------------------------------
        
        // データの読み込み関数
        async function fetchSongs() {
            const grid = document.getElementById('grid');
            const loading = document.getElementById('loadingMsg');
            
            grid.innerHTML = '';
            loading.style.display = 'block';

            try {
                // 日付が新しい順に取得
                const q = query(collection(db, COLLECTION_NAME), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                loading.style.display = 'none';

                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="text-align:center; width:100%;">まだ投稿がありません。一番乗りで投稿してみませんか？🕊️</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    grid.innerHTML += createCard(data);
                });

            } catch (error) {
                console.error("Error getting documents: ", error);
                loading.style.display = 'none';
                grid.innerHTML = '<p style="text-align:center; color:red;">読み込みに失敗しました。Firebaseの設定（テストモードなど）を確認してください。</p>';
            }
        }

        // 投稿ボタンの処理
        const form = document.getElementById('songForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const title = document.getElementById('title').value;
            const artist = document.getElementById('artist').value;
            const url = document.getElementById('url').value;
            const comment = document.getElementById('comment').value;

            // バリデーション
            if (!detectService(url)) {
                alert('Spotify, Apple Music, YouTube のいずれかのURLを入力してください。');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "送信中...";

                // Firestoreに保存
                await addDoc(collection(db, COLLECTION_NAME), {
                    title: title,
                    artist: artist,
                    url: url,
                    comment: comment,
                    createdAt: serverTimestamp() // サーバー時間を記録
                });

                form.reset();
                alert('投稿しました！共有ありがとうございます。');
                fetchSongs(); // リストを再読み込み

            } catch (error) {
                console.error("Error adding document: ", error);
                alert("投稿に失敗しました。エラー: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "投稿する";
            }
        });

        // 初回読み込み
        fetchSongs();

    </script>
</body>
</html>
